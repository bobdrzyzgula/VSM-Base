# Build the User's Guide (PDF and HTML) and attach it to a GitHub release.
#
# Push a version tag to make a release:
#     git tag v0.1.0-alpha && git push origin v0.1.0-alpha
# The release is named for the tag, and marked as a pre-release when the
# tag contains "alpha", "beta" or "rc". It carries the guide and the motor-control
# paper, each as PDF and as a single HTML page, and the model file. The release notes can be edited on
# GitHub afterwards.
#
# Run it by hand (Actions -> Release -> Run workflow) to build the guide
# without releasing; the documents are then kept as a workflow artifact.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pandoc and Typst
        run: |
          curl -fsSL -o /tmp/pandoc.deb \
            https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb
          curl -fsSL -o /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          pandoc --version | head -1
          typst --version

      - name: Build the guide
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            make docs VERSION="${GITHUB_REF_NAME#v}"
          else
            make docs
          fi
          cp scad/vsm_base.scad standalone/bobbin-box/bobbin_box.scad standalone/nut-tool/nut_tool.scad standalone/tilt-prop/tilt_prop.scad standalone/shaft-height-gauge/shaft_height_gauge.scad standalone/floor-span-gauge/floor_span_gauge.scad standalone/shaft-fit-collars/shaft_fit_collars.scad standalone/harness-handle/harness_handle.scad standalone/motor-rig/motor_rig.scad standalone/motor-rig/motor_cradle.scad standalone/motor-rig/prony_brake.scad build/

      - name: Keep the documents (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: vsm-base-guide
          path: build/

      - name: Create the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "${GITHUB_REF_NAME}" in *alpha*|*beta*|*rc*) pre="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" $pre \
            --title "VSM Base ${GITHUB_REF_NAME}" \
            --notes "VSM Base ${GITHUB_REF_NAME}. The User's Guide, the paper on motor speed control and its two companions, on motor construction (Inside the Motor) and on the switching devices (Inside a Switching Circuit), and the design studies A Force-Sensing Pedal and An Analog Force-Sensing Knee Controller, are attached as PDF and as single HTML pages (open them in any browser). The model is scad/vsm_base.scad in the source, also attached; it needs OpenSCAD 2021.01 or later and BOSL2. bobbin_box.scad, nut_tool.scad, tilt_prop.scad, shaft_height_gauge.scad, floor_span_gauge.scad and shaft_fit_collars.scad are the standalone bobbin box, nut tool, tilt prop, shaft height gauge, floor span gauge and shaft fit collars; harness_handle.scad is an experimental grip for a carrying harness, not yet printed or load-tested, and not for carrying a machine until a complete harness has passed a proof-load test; motor_rig.scad, motor_cradle.scad and prony_brake.scad are the motor test rig, whose guide is vsm-motor-rig.pdf (and .html). This is an alpha: see the guide for what has and has not been printed and tested. VSM Base is an open-source hobby project, personal learning done in public, not a product; it is provided as is under the MIT license, and anyone who uses or builds on any of it does so on their own responsibility. RESEARCH USE ONLY for the motor controls: none of the controller designs (the knee controller option, the papers' circuits, the hardware/ schematics) is a safe, buildable design; none has been built, tested or safety-assessed, and none should be built or connected to the mains as drawn. The motor rig guide describes live mains experiments for qualified people in a controlled setup only. See docs/VALIDATION.md." \
            build/vsm-base-guide.pdf build/vsm-base-guide.html build/vsm-motor-control.pdf build/vsm-motor-control.html build/vsm-inside-the-motor.pdf build/vsm-inside-the-motor.html build/vsm-inside-a-switching-circuit.pdf build/vsm-inside-a-switching-circuit.html build/vsm-force-sensing-pedal.pdf build/vsm-force-sensing-pedal.html build/vsm-analog-knee-controller.pdf build/vsm-analog-knee-controller.html build/vsm-motor-rig.pdf build/vsm-motor-rig.html build/vsm_base.scad build/bobbin_box.scad build/nut_tool.scad build/tilt_prop.scad build/shaft_height_gauge.scad build/floor_span_gauge.scad build/shaft_fit_collars.scad build/harness_handle.scad build/motor_rig.scad build/motor_cradle.scad build/prony_brake.scad
