# Publishes docs-snapshot/ (the hand-committed HTML snapshot of the
# documents) on GitHub Pages whenever it changes. Pages must be set to
# deploy from GitHub Actions (Settings > Pages > Source).
name: Publish the documents snapshot

on:
  push:
    branches: [main]
    paths: ["docs-snapshot/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Packing and deploying in separate jobs, as deploy-pages expects: in
  # one job, deploy-pages looked for the artifact before it was listed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-snapshot
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
